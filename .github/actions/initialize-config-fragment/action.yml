name: 'Initialize Config Fragment'
description: 'Initialize Config Fragment (composite, keeps the workflow to one entry)'

runs:
  using: "composite"
  steps:
    - name: Initialize Config Fragment
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/kernel/common"
        printf '%s\n' \
          '# CONFIG_KSU_TAMPER_SYSCALL_TABLE is not set' \
          'CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y' \
          'CONFIG_KSU_SHELL_HAS_SU_ALWAYS=y' \
          > "${{ github.workspace }}/kernel/common/wild_defconfig.fragment"
